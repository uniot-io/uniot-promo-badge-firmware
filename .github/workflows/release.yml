name: Release

# Pushing a tag such as 1.0.0 builds the three images, publishes them as a GitHub Release, and
# redeploys the firmware site uniot-web-installer reads.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
      # The version reaches the firmware through the build flags. The tag pattern above admits
      # only digits and dots, so it is safe inside a C string. Every pio call in this job has
      # to see the same value -- a different one empties the build directories.
      PLATFORMIO_BUILD_FLAGS: '-DBADGE_VERSION=\"${{ github.ref_name }}\"'
    steps:
      - uses: actions/checkout@v4

      # First, so a missing entry fails in seconds rather than after the build.
      - name: Take the release notes from CHANGELOG.md
        run: |
          awk -v heading="## $VERSION" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no '## $VERSION' section"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('platformio.ini') }}

      # esptool is installed separately because PlatformIO's copy does not bring its own
      # dependencies into this Python; it merges the images after the build.
      - name: Install PlatformIO and esptool
        run: pip install platformio "esptool>=4.8,<5"

      - name: Build
        run: pio run -e uniot_app -e uniot_app_full_range -e factory_test

      - name: Package
        run: python .github/scripts/package_release.py "$VERSION" dist

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/
            notes.md

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*

  site:
    needs: release
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
