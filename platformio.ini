[platformio]
default_envs = uniot_app

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200

build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -D ARDUINO_USB_MODE=1
    -D SERIALCONS=USBSerial
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.3
    adafruit/Adafruit_VL53L0X@^1.2.4

[env:factory_test]
build_src_filter = +<factory_test/main.cpp>
build_flags =
    ${env.build_flags}
lib_deps =
    ${env.lib_deps}

; Everything the badge firmware needs, shared by its two radio variants below.
[uniot_app_base]
build_src_filter = +<uniot_app/main.cpp>
board_build.filesystem = littlefs
build_flags =
    ${env.build_flags}
    -D UNIOT_CREATOR_ID=\"UNIOT\"
    -D UNIOT_LOG_ENABLED=1
    -D UNIOT_USE_LITTLEFS=1
    -D UNIOT_LOG_LEVEL=UNIOT_LOG_LEVEL_DEBUG
    -D UNIOT_LISP_HEAP=32768
    -D MQTT_MAX_PACKET_SIZE=4096
lib_deps =
    ${env.lib_deps}
    uniot-io/uniot-core@^0.9.0

; Compatible: transmits at 8.5 dBm instead of the default 19.5. Some ESP32-C3 modules
; cannot hold a WiFi connection at full power, and nothing on the board tells them apart,
; so this is the build badges ship with -- it works on all of them, at a shorter range.
[env:uniot_app]
extends = uniot_app_base
build_flags =
    ${uniot_app_base.build_flags}
    -D ENABLE_LOWER_WIFI_TX_POWER=1

; Full range: the default transmit power, for modules whose radio copes with it.
[env:uniot_app_full_range]
extends = uniot_app_base

[env:uniot_sleep_example]
build_src_filter = +<sleep_example/main.cpp>
board_build.filesystem = littlefs
build_flags =
    ${env.build_flags}
    -D UNIOT_CREATOR_ID=\"UNIOT\"
    -D UNIOT_LOG_ENABLED=1
    -D UNIOT_USE_LITTLEFS=1
    -D UNIOT_LOG_LEVEL=UNIOT_LOG_LEVEL_DEBUG
    -D UNIOT_LISP_HEAP=32768
    -D MQTT_MAX_PACKET_SIZE=2048
    ; -D ENABLE_LOWER_WIFI_TX_POWER=1
lib_deps =
    uniot-io/uniot-core@^0.9.0